name: Deploy staging (dev.bitcoineducation.quest)
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
concurrency:
  group: staging-dev
  cancel-in-progress: true
# Least privilege: nothing at workflow level; the job only reads the repo.
# The Pages deploy uses the Cloudflare API token secret, not the GitHub token.
permissions: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build staging copy (staging Firebase config, noindex, badge; fails if any live key remains)
        env:
          STAGING_APPCHECK_DEBUG_TOKEN: ${{ secrets.STAGING_APPCHECK_DEBUG_TOKEN }}
        run: bash scripts/build-staging.sh
      - name: Deploy to Cloudflare Pages bq-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_PAGES_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: bc12a6ce8540408b7552f1d658c45bf7
        run: npx --yes wrangler@3.114.17 pages deploy out --project-name bq-staging --branch main --commit-dirty=true
