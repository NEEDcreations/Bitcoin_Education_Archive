name: Nightly Firestore backup copy to Cloudflare R2

# Copies the nightly Firestore export (written ~9:03 PM ET by dailyFirestoreBackup)
# from GCS to the private R2 bucket bq-user-backups, encrypted with age to the owner's
# public key (age/firestore/<date>/). No passphrase or private key is used or stored here.
# Read-only on GCP. Never echoes secrets. A failed run fails the job (GitHub emails the owner).

on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC = 9:30 PM EST / 10:30 PM EDT
  workflow_dispatch:
    inputs:
      date:
        description: "Export folder date (YYYY-MM-DD, UTC). Blank = today UTC."
        required: false

# No repository checkout and no GitHub API calls.
# GCP uses GCP_BACKUP_READER_KEY. R2 uses CF_R2_BACKUP_TOKEN. BACKUP_PASSPHRASE is no longer used.
permissions: {}

concurrency:
  group: r2-nightly-backup
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    env:
      BUCKET: bitcoin-education-archive-backups
      R2_BUCKET: bq-user-backups
    steps:
      - name: Pick export date
        id: d
        env:
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          D="${IN_DATE:-$(date -u +%F)}"
          [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::bad date"; exit 1; }
          echo "date=$D" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_BACKUP_READER_KEY }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Download export
        run: |
          D="${{ steps.d.outputs.date }}"
          mkdir -p work && cd work
          gcloud storage ls "gs://$BUCKET/$D/$D.overall_export_metadata" >/dev/null \
            || { echo "::error::No completed export for $D"; exit 1; }
          gcloud storage cp -r "gs://$BUCKET/$D" . --quiet
          N=$(find "$D" -type f | wc -l)
          echo "files=$N bytes=$(du -sb "$D" | cut -f1)"
          [ "$N" -gt 10 ] || { echo "::error::Export looks incomplete ($N files)"; exit 1; }

      - name: Tar and encrypt to the owner's age public key
        env:
          # Public key only (not a secret). Override with repo variable BACKUP_AGE_RECIPIENT.
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT || 'age1vgf3kd0h976w2ccwafa7q28mm04zk8sjhlhw94nza3ghfu0fc52sxzcjhm' }}
        run: |
          set -euo pipefail
          D="${{ steps.d.outputs.date }}"
          [[ "$AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || { echo "::error::bad age recipient"; exit 1; }
          sudo apt-get install -y -qq age >/dev/null
          cd work
          tar -czf "bq-firestore-$D.tar.gz" "$D"
          sha256sum "bq-firestore-$D.tar.gz" | cut -d' ' -f1 > "bq-firestore-$D.tar.gz.sha256"
          age -r "$AGE_RECIPIENT" -o "bq-firestore-$D.tar.gz.age" "bq-firestore-$D.tar.gz"
          [ "$(head -c 21 "bq-firestore-$D.tar.gz.age")" = "age-encryption.org/v1" ] || { echo "::error::age output invalid"; exit 1; }
          echo "encrypted bq-firestore-$D.tar.gz.age $(stat -c%s "bq-firestore-$D.tar.gz.age") plaintext_sha256=$(cat "bq-firestore-$D.tar.gz.sha256")"
          rm -rf "$D" "bq-firestore-$D.tar.gz"

      - name: Upload to R2
        env:
          CF_TOKEN: ${{ secrets.CF_R2_BACKUP_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          D="${{ steps.d.outputs.date }}"
          F="work/bq-firestore-$D.tar.gz.age"
          KEY="age%2Ffirestore%2F$D%2Fbq-firestore-$D.tar.gz.age"
          URL="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/$R2_BUCKET/objects/$KEY"
          RES=$(curl -sS --retry 3 -X PUT "$URL" -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$F")
          echo "$RES" | jq -e '.success == true' >/dev/null || { echo "::error::R2 upload failed: $(echo "$RES" | jq -c .errors)"; exit 1; }
          SIZE=$(echo "$RES" | jq -r .result.size)
          [ "$SIZE" = "$(stat -c%s "$F")" ] || { echo "::error::size mismatch"; exit 1; }
          echo "uploaded age/firestore/$D/bq-firestore-$D.tar.gz.age size=$SIZE"
