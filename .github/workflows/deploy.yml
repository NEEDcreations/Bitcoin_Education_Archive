name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]

# Least privilege: nothing at workflow level; the deploy job gets only:
# contents: read — checkout the static site
# pages: write — upload the Pages artifact and create the deployment
# id-token: write — OIDC token that deploy-pages exchanges for the deployment
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Stage static site (exclude sensitive dirs)
        run: |
          mkdir _site
          rsync -a \
            --exclude='functions/' \
            --exclude='.wrangler/' \
            --exclude='.firebase/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='*.sh' \
            --exclude='*.py' \
            --exclude='*.mjs' \
            --exclude='*.bak' \
            --exclude='*.src' \
            --exclude='*.src.*' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='workers/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='firestore.rules' \
            --exclude='storage.rules' \
            --exclude='firestore.indexes.json' \
            --exclude='*.md' \
            . _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
