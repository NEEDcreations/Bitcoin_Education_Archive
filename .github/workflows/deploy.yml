name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site (exclude sensitive dirs)
        run: |
          mkdir _site
          rsync -a \
            --exclude='functions/' \
            --exclude='.wrangler/' \
            --exclude='.firebase/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='*.sh' \
            --exclude='*.py' \
            --exclude='*.mjs' \
            --exclude='*.bak' \
            --exclude='*.src' \
            --exclude='*.src.*' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='workers/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='firestore.rules' \
            --exclude='storage.rules' \
            --exclude='firestore.indexes.json' \
            --exclude='*.md' \
            . _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
