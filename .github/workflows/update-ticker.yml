name: Update Signal ticker

# After the Cloudflare Worker in workers/signal-ticker is shipped live,
# this workflow can be disabled. Do not disable it until that ship is done.
# Every 4 hours, the same cadence the old OpenClaw cron used.
# GITHUB_TOKEN commits do not trigger deploy.yml, so this workflow
# also deploys GitHub Pages when newsletter-data.json changes.
# No secrets or API keys are required for the feed refresh.
on:
  schedule:
    - cron: "5 */4 * * *"
  workflow_dispatch:

# Least privilege: nothing at workflow level; the one job asks for what it uses.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write  -> push newsletter-data.json to gh-pages
    # pages + id-token -> deploy GitHub Pages when it changed
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: gh-pages
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run ticker tests
        run: node tests/test-update-ticker.js

      - name: Refresh newsletter-data.json
        run: node scripts/update-ticker.js

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add newsletter-data.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No ticker changes"
            exit 0
          fi
          git commit -m "Auto-update ticker headlines"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Stage static site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir _site
          rsync -a \
            --exclude='functions/' \
            --exclude='.wrangler/' \
            --exclude='.firebase/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='_site/' \
            --exclude='.git/' \
            --exclude='*.sh' \
            --exclude='*.py' \
            --exclude='*.mjs' \
            --exclude='*.bak' \
            --exclude='*.src' \
            --exclude='*.src.*' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='workers/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='firestore.rules' \
            --exclude='storage.rules' \
            --exclude='firestore.indexes.json' \
            --exclude='*.md' \
            --exclude='firebase.*.json' \
            . _site/

      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
