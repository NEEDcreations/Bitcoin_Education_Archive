name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:

# Detection only. Do not validate secrets against live services.
permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTERLEAKS_VALIDATE: "false"
      BETTERLEAKS_ANALYZE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Betterleaks v2 (checksum-verified)
        env:
          BETTERLEAKS_VERSION: "2.0.0-rc.7"
          # sha256 of betterleaks_2.0.0-rc.7_linux_x64.tar.gz from the official
          # checksums.txt, itself Sigstore-verified against the release.yml
          # identity at refs/tags/v2.0.0-rc.7.
          BETTERLEAKS_SHA256: "230ef42dc3a0ee35e5148b7b4e9280224a412ef100cd4e74d3d6681d94e6ccb8"
        run: |
          set -euo pipefail
          archive="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/${archive}"
          curl -sSLf -o "$archive" "$url"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" betterleaks
          install -m 0755 betterleaks "$HOME/.local/bin/betterleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ./betterleaks version

      - name: Scan (detection only, redacted)
        run: |
          set -euo pipefail
          # Scan new commits on the event, not the full history. A full-history
          # audit is a maintainer job; historical findings must not block every PR.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            betterleaks git . --redact --no-banner --validate=false --revision "${base}..${head}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            betterleaks git . --redact --no-banner --validate=false --revision "${{ github.event.before }}..${{ github.sha }}"
          else
            betterleaks git . --redact --no-banner --validate=false --revision "${{ github.sha }}"
          fi
