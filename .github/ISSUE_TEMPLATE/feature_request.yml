name: Feature request
description: An idea for the app
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and who it affects.
      placeholder: New players cannot tell which lesson to open first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the app to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, if any.
  - type: checkboxes
    id: not-security
    attributes:
      label: Not a vulnerability
      options:
        - label: This is a product idea, not a security report
          required: true
