<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0804"/>
      <stop offset="100%" stop-color="#150F05"/>
    </linearGradient>
    <!-- Orange radial glow -->
    <radialGradient id="glow1" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F7931A" stop-opacity="0"/>
    </radialGradient>
    <!-- Nacho glow -->
    <radialGradient id="nachoglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F7931A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F7931A" flood-opacity="0.25"/>
    </filter>
    <clipPath id="nachoClip">
      <circle cx="920" cy="340" r="230"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Subtle grid lines -->
  <g stroke="#F7931A" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#F7931A"/>

  <!-- Left content area -->

  <!-- Eyebrow pill -->
  <rect x="56" y="62" width="248" height="34" rx="17" fill="#F7931A" fill-opacity="0.12" stroke="#F7931A" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="79" cy="79" r="5" fill="#F7931A"/>
  <text x="93" y="84" font-family="'Arial', sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#F7931A">FREE · NO EXPERIENCE NEEDED</text>

  <!-- Main headline -->
  <text x="56" y="175" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="82" fill="#FFF5E1" letter-spacing="-1">GET PAID</text>
  <text x="56" y="264" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="82" fill="#F7931A" letter-spacing="-1">TO LEARN</text>
  <text x="56" y="353" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="82" fill="#FFF5E1" letter-spacing="-1">BITCOIN</text>

  <!-- Sub copy -->
  <text x="58" y="398" font-family="'Arial', sans-serif" font-weight="400" font-size="20" fill="#FFF5E1" fill-opacity="0.5">Watch videos, take quizzes, battle friends.</text>
  <text x="58" y="424" font-family="'Arial', sans-serif" font-weight="600" font-size="20" fill="#FFF5E1" fill-opacity="0.75">Earn 500 sats per user, every single day.</text>

  <!-- Stat pills row -->
  <!-- Pill 1 -->
  <rect x="56" y="454" width="148" height="72" rx="12" fill="#F7931A" fill-opacity="0.1" stroke="#F7931A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="130" y="490" text-anchor="middle" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="30" fill="#F7931A">500</text>
  <text x="130" y="511" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.4">SATS/USER/DAY</text>

  <!-- Pill 2 -->
  <rect x="212" y="454" width="148" height="72" rx="12" fill="#F7931A" fill-opacity="0.1" stroke="#F7931A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="286" y="490" text-anchor="middle" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="30" fill="#F7931A">21K</text>
  <text x="286" y="511" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.4">SAT JACKPOT</text>

  <!-- Pill 3 -->
  <rect x="368" y="454" width="148" height="72" rx="12" fill="#F7931A" fill-opacity="0.1" stroke="#F7931A" stroke-opacity="0.25" stroke-width="1"/>
  <text x="442" y="490" text-anchor="middle" font-family="'Arial Black', 'Arial', sans-serif" font-weight="900" font-size="30" fill="#F7931A">$0</text>
  <text x="442" y="511" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.4">COST TO JOIN</text>

  <!-- URL + lightning -->
  <text x="58" y="572" font-family="'Arial', sans-serif" font-weight="700" font-size="17" letter-spacing="1" fill="#F7931A">⚡ bitcoineducation.quest</text>
  <text x="58" y="596" font-family="'Arial', sans-serif" font-size="14" fill="#FFF5E1" fill-opacity="0.3">Withdraw real Bitcoin over Lightning. Free forever.</text>

  <!-- NACHO — right side glow circle -->
  <circle cx="920" cy="345" r="235" fill="url(#nachoglow)"/>
  <circle cx="920" cy="345" r="200" fill="#F7931A" fill-opacity="0.05" stroke="#F7931A" stroke-opacity="0.12" stroke-width="1"/>

  <!-- NACHO SVG (scaled up, centered at 920,345) -->
  <g transform="translate(660,90) scale(1.35)" filter="url(#softshadow)">
    <!-- Antlers -->
    <g fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round">
      <path d="M70 65 L55 30 L45 40"/>
      <path d="M55 30 L60 15"/>
      <path d="M55 30 L40 20"/>
      <path d="M130 65 L145 30 L155 40"/>
      <path d="M145 30 L140 15"/>
      <path d="M145 30 L160 20"/>
    </g>
    <!-- Ears -->
    <ellipse cx="62" cy="72" rx="18" ry="12" fill="#D2854D" transform="rotate(-30,62,72)"/>
    <ellipse cx="62" cy="72" rx="12" ry="7" fill="#F0B88A" transform="rotate(-30,62,72)"/>
    <ellipse cx="138" cy="72" rx="18" ry="12" fill="#D2854D" transform="rotate(30,138,72)"/>
    <ellipse cx="138" cy="72" rx="12" ry="7" fill="#F0B88A" transform="rotate(30,138,72)"/>
    <!-- Head -->
    <ellipse cx="100" cy="110" rx="50" ry="48" fill="#D2854D"/>
    <!-- Face lighter area -->
    <ellipse cx="100" cy="118" rx="35" ry="34" fill="#E8C9A0"/>
    <!-- Eyes -->
    <ellipse cx="82" cy="102" rx="12" ry="13" fill="white"/>
    <ellipse cx="118" cy="102" rx="12" ry="13" fill="white"/>
    <circle cx="84" cy="103" r="7" fill="#2D1B00"/>
    <circle cx="120" cy="103" r="7" fill="#2D1B00"/>
    <circle cx="87" cy="100" r="3" fill="white"/>
    <circle cx="123" cy="100" r="3" fill="white"/>
    <!-- Nose -->
    <ellipse cx="100" cy="125" rx="10" ry="7" fill="#1a1a1a"/>
    <ellipse cx="100" cy="124" rx="10" ry="6.5" fill="#333"/>
    <ellipse cx="97" cy="122" rx="3" ry="2" fill="#555" opacity="0.6"/>
    <!-- Smile -->
    <path d="M90 133 Q100 142 110 133" fill="none" stroke="#5D3A1A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Cheek blush -->
    <circle cx="72" cy="118" r="8" fill="#F7931A" opacity="0.3"/>
    <circle cx="128" cy="118" r="8" fill="#F7931A" opacity="0.3"/>
    <!-- Body -->
    <ellipse cx="100" cy="170" rx="38" ry="28" fill="#D2854D"/>
    <!-- Orange scarf -->
    <path d="M65 148 Q100 158 135 148 Q132 165 120 168 Q100 172 80 168 Q68 165 65 148Z" fill="#F7931A"/>
    <path d="M100 168 L96 185 L104 185 Z" fill="#F7931A"/>
    <!-- Bitcoin B on scarf -->
    <text x="100" y="163" text-anchor="middle" font-size="18" font-weight="bold" fill="white" font-family="Arial, sans-serif">₿</text>
  </g>

  <!-- Floating badges around Nacho -->
  <!-- Quiz badge -->
  <rect x="1055" y="140" width="110" height="44" rx="22" fill="#0A0804" stroke="#F7931A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1110" y="160" text-anchor="middle" font-family="'Arial', sans-serif" font-size="15">🧠</text>
  <text x="1110" y="178" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.6">QUIZ</text>

  <!-- Battle badge -->
  <rect x="670" y="130" width="120" height="44" rx="22" fill="#0A0804" stroke="#F7931A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="730" y="150" text-anchor="middle" font-family="'Arial', sans-serif" font-size="15">⚔️</text>
  <text x="730" y="168" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.6">BATTLE PVP</text>

  <!-- Watch badge -->
  <rect x="664" y="450" width="118" height="44" rx="22" fill="#0A0804" stroke="#F7931A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="723" y="470" text-anchor="middle" font-family="'Arial', sans-serif" font-size="15">📺</text>
  <text x="723" y="488" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.6">WATCH</text>

  <!-- Mine badge -->
  <rect x="1050" y="460" width="118" height="44" rx="22" fill="#0A0804" stroke="#F7931A" stroke-opacity="0.4" stroke-width="1"/>
  <text x="1109" y="480" text-anchor="middle" font-family="'Arial', sans-serif" font-size="15">⛏️</text>
  <text x="1109" y="498" text-anchor="middle" font-family="'Arial', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#FFF5E1" fill-opacity="0.6">MINE</text>

  <!-- Lightning bolt accent near Nacho -->
  <text x="1080" y="330" font-family="'Arial', sans-serif" font-size="44" fill="#F7931A" fill-opacity="0.7">⚡</text>

  <!-- Bottom accent bar -->
  <rect x="0" y="626" width="1200" height="4" fill="#F7931A"/>
</svg>
