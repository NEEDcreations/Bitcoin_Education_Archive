<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <!-- Nacho v2 flying — sticker line-art style matching nacho-deer.svg.
       Orange cape + wind lines, happy closed eyes. -->
  <style>
    .ink { stroke: #0f172a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .body { fill: #ffffff; }
    .solid { fill: #0f172a; stroke: none; }
    #fly { animation: nFly 2.6s ease-in-out infinite; transform-origin: 110px 100px; }
    @keyframes nFly { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-6px) rotate(-2deg); } }
    @media (prefers-reduced-motion: reduce) { #fly { animation: none; } }
  </style>

  <!-- wind lines -->
  <g stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.35">
    <path d="M46 52Q26 47 8 44"><animate attributeName="d" values="M46 52Q26 47 8 44;M46 52Q29 50 8 48;M46 52Q26 47 8 44" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M36 92Q18 90 0 87"><animate attributeName="d" values="M36 92Q18 90 0 87;M36 92Q21 94 0 91;M36 92Q18 90 0 87" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M48 132Q30 132 12 130"><animate attributeName="d" values="M48 132Q30 132 12 130;M48 132Q33 135 12 134;M48 132Q30 132 12 130" dur="1.3s" repeatCount="indefinite"/></path>
  </g>

  <g id="fly" transform="rotate(8 110 100)">
    <!-- cape -->
    <path d="M78 108Q48 124 34 156q14-6 22 2 6-16 18-12-4-14 10-22Z" fill="#f7931a" stroke="#0f172a" stroke-width="5.5" stroke-linejoin="round">
      <animate attributeName="d"
        values="M78 108Q48 124 34 156q14-6 22 2 6-16 18-12-4-14 10-22Z;M78 108Q44 120 26 148q15-4 24 6 7-17 19-13-5-15 9-21Z;M78 108Q48 124 34 156q14-6 22 2 6-16 18-12-4-14 10-22Z"
        dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- antlers -->
    <path class="ink" d="M104 44 95 18"/>
    <path class="ink" d="M95 18l2-14"/>
    <path class="ink" d="M95 18 81 15"/>
    <path class="ink" d="M150 46l9-26"/>
    <path class="ink" d="M159 20l-2-14"/>
    <path class="ink" d="M159 20l14-3"/>
    <!-- ears -->
    <path class="ink body" d="M92 68C80 52 63 46 52 55c6 15 23 23 40 21Z"/>
    <path class="ink body" d="M164 70c11-17 28-24 40-15-5 16-22 25-40 23Z"/>
    <!-- trailing legs -->
    <path class="ink" d="M96 152q-10 14-26 16"/>
    <path class="ink" d="M126 158q-4 16-16 24"/>
    <ellipse class="solid" cx="68" cy="169" rx="8.5" ry="5.5" transform="rotate(-24 68 169)"/>
    <ellipse class="solid" cx="109" cy="183" rx="8.5" ry="5.5" transform="rotate(-58 109 183)"/>
    <!-- body -->
    <path class="ink body" d="M100 118c-10 24-2 42 18 46 20 4 34-10 32-38"/>
    <!-- head -->
    <path class="ink body" d="M128 42c32 4 50 27 47 53-3 28-26 46-58 42-31-4-49-27-46-54 3-26 26-44 57-41Z"/>
    <!-- blush -->
    <circle cx="96" cy="106" r="6" fill="#f7931a" opacity="0.28"/>
    <circle cx="160" cy="112" r="6" fill="#f7931a" opacity="0.28"/>
    <!-- happy closed eyes -->
    <path class="ink" d="M104 90q6-7 13-1" stroke-width="5.5"/>
    <path class="ink" d="M143 93q6-7 13-1" stroke-width="5.5"/>
    <!-- muzzle -->
    <ellipse class="ink body" cx="128" cy="112" rx="18" ry="12" stroke-width="6" transform="rotate(4 128 112)"/>
    <path d="M124 105.5h7l-3.5 4.4Z" fill="#0f172a" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <path class="ink" d="M120.5 117c3.5 3 11.5 3 15 0" stroke-width="3"/>
    <!-- scarf -->
    <path d="M96 130q26 14 52 6-1 14-12 18-14 4-28-1-11-4-12-23Z" fill="#f7931a" stroke="#0f172a" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M112 142.5v11m0-11h4.6a3 3 0 0 1 0 6h-4.6m0 0h5.3a3 3 0 0 1 0 6h-5.3" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(6 112 148)"/>
  </g>
</svg>
